name: Full CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-ci:
    runs-on: ubuntu-latest
    concurrency:
      group: full-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser for isolated bridge UI regression
        run: npm exec playwright install -- --with-deps chromium
      - name: Run full test suite
        run: npm run test -- --workers=1
      - name: Prepare pinned PostgreSQL image for disposable first-stage verification
        run: |
          node --input-type=module -e 'import {execFileSync} from "node:child_process"; import {ORACLE_IMAGE,ORACLE_PLATFORM} from "./scripts/automation/wcv-c3-pre-p-postgresql-security-state-oracle.mjs"; execFileSync("docker",["pull","--platform",ORACLE_PLATFORM,ORACLE_IMAGE],{stdio:"inherit",timeout:180000});'
      - name: Verify first-stage actual SQL and browser with synthetic-only data
        timeout-minutes: 15
        run: node --experimental-strip-types --loader ./tests/ts-extension-loader.mjs --test tests/first-stage-private-postgres.test.mjs
      - name: Verify learner loop
        run: npm run verify:learner-loop:ci
      - name: Build
        run: npm run build
      - name: Check closed-beta readiness
        run: npm run check:closed-beta-readiness

  full-ci-windows:
    name: full-ci-windows
    runs-on: windows-latest
    concurrency:
      group: full-windows-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Verify canonical checkout line endings
        shell: pwsh
        run: |
          $unexpected = git ls-files --eol | Select-String 'i/lf\s+w/(?:crlf|mixed)'
          if ($unexpected) {
            $unexpected | ForEach-Object { Write-Error $_.Line }
            exit 1
          }
      - name: Install dependencies
        run: npm.cmd ci
      - name: Install browser for isolated bridge UI regression
        run: npm.cmd exec playwright install -- chromium
      - name: Typecheck
        run: npm.cmd run typecheck
      - name: Lint
        run: npm.cmd run lint
      - name: Run full test suite
        run: npm.cmd run test -- --workers=1
      - name: Build
        run: npm.cmd run build
