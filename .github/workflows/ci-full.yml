name: Full CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: validation-profile
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.risk.outputs.profile }}
      validation_route: ${{ steps.risk.outputs.validation_route }}
      heavy_windows_required: ${{ steps.risk.outputs.heavy_windows_required }}
      representative_e2e_required: ${{ steps.risk.outputs.representative_e2e_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Classify changed paths
        id: risk
        run: node scripts/automation/classify-risk.mjs

  heavy-linux:
    needs: classify
    if: needs.classify.outputs.profile == 'MEDIUM' || needs.classify.outputs.profile == 'HIGH'
    uses: ./.github/workflows/reusable-heavy-validation-v2.yml
    with:
      profile: ${{ needs.classify.outputs.profile }}
      platform: linux
      validation_route: ${{ needs.classify.outputs.validation_route }}
      representative_e2e_required: ${{ needs.classify.outputs.representative_e2e_required == 'true' }}

  heavy-windows:
    needs: classify
    if: needs.classify.outputs.heavy_windows_required == 'true'
    uses: ./.github/workflows/reusable-heavy-validation-v2.yml
    with:
      profile: HIGH
      platform: windows
      validation_route: ${{ needs.classify.outputs.validation_route }}
      representative_e2e_required: false

  full-ci:
    name: full-ci
    if: always()
    needs: [classify, heavy-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Linux profile disposition
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          PROFILE: ${{ needs.classify.outputs.profile }}
          HEAVY_RESULT: ${{ needs.heavy-linux.result }}
        run: |
          node -e "const {CLASSIFY_RESULT:c,PROFILE:p,HEAVY_RESULT:h}=process.env; if(c!=='success'||!['LOW','MEDIUM','HIGH'].includes(p)||(p==='LOW'?h!=='skipped':h!=='success')){console.error({c,p,h});process.exit(1)} console.log({profile:p,heavyLinux:h})"

  full-ci-windows:
    name: full-ci-windows
    if: always()
    needs: [classify, heavy-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Verify Windows profile disposition
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          PROFILE: ${{ needs.classify.outputs.profile }}
          WINDOWS_REQUIRED: ${{ needs.classify.outputs.heavy_windows_required }}
          HEAVY_RESULT: ${{ needs.heavy-windows.result }}
        run: |
          node -e "const {CLASSIFY_RESULT:c,PROFILE:p,WINDOWS_REQUIRED:w,HEAVY_RESULT:h}=process.env; if(c!=='success'||!['LOW','MEDIUM','HIGH'].includes(p)||(w==='true'?h!=='success':h!=='skipped')){console.error({c,p,w,h});process.exit(1)} console.log({profile:p,windowsRequired:w,heavyWindows:h})"
