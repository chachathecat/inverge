name: Conditional Auto Merge

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      expected_head_sha:
        description: Exact reviewed 40-character head SHA
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: auto-merge-v2-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request_review' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.review.body, 'FAST_DELIVERY_V2_FINAL_REVIEW'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Re-fetch, validate, mark Ready, and squash exact head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_head_sha }}
        run: node scripts/automation/automatic-merge-v2.mjs
