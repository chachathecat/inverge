name: Conditional Auto Merge

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Exact pull request number to re-evaluate
        required: true
        type: number
      expected_head_sha:
        description: Exact 40-character pull request head SHA
        required: true
        type: string

permissions:
  checks: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: router-v2-lite-${{ github.event.pull_request.number || inputs.pull_request_number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Conservative Router V2 Lite
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.review.body, 'FAST_DELIVERY_ROUTER_V2_LITE_FINAL_REVIEW')
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted main router code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: main
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Re-fetch exact evidence and route conservatively
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
        run: node scripts/automation/automatic-merge-v2-lite.mjs
