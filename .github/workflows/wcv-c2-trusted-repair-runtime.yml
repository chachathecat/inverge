name: WCV C2 Trusted Repair Runtime

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  wcv-c2-trusted-repair-runtime:
    name: wcv-c2-trusted-repair-runtime
    if: >-
      github.event.pull_request.head.ref == 'agent/wcv-c2-first-trusted-repair-vertical' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: wcv-c2-trusted-repair-runtime-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      CI: "true"
      DO_NOT_TRACK: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      WCV_C2_RUNTIME_EVIDENCE_PATH: ${{ github.workspace }}/.agent-factory/wcv-c2-trusted-repair-runtime-evidence.json
      WCV_C2_SUPABASE_WORKDIR: ${{ runner.temp }}/wcv-c2-supabase-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PR_HEAD_SHA}"
          [[ "${PR_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run exact-head isolated Supabase preflight
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/automation/verify-wcv-c2-trusted-repair-runtime.mjs

      - name: Unconditionally remove local Supabase state
        if: always()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          node scripts/automation/verify-wcv-c2-trusted-repair-runtime.mjs
          --cleanup
          --require-complete

      - name: Recheck exact head and unchanged dependency declarations
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${PR_HEAD_SHA}"
          git diff --exit-code -- package.json package-lock.json

      - name: Upload metadata-only exact-head evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wcv-c2-trusted-repair-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.WCV_C2_RUNTIME_EVIDENCE_PATH }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
